id: shop
title: "&0&lClan Shop"
size: 54
open_args:
  - 'shop'

model: clan_only

Items:


  diamond:
    slot: 9
    material: DIAMOND
    lore:
      - ""
      - "&6• Cost &610 coins"
      - "&6• Your balance &6%clan_coin% coins"
      - ""
      - "&7▶ Click to buy"
    on_click:
      any:
        - check1:
            if: "%clan_coin% >= 10"
            then:
              - "[console] minecraft:give %player_name% diamond 1"
              - "[coin_take] 10"
              - "[open] shop"
            else:
              - "[message] &cYou do not have enough coins."


  orange:
