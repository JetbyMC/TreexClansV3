prefix: "<#FFE259>&lTreexClans</#FFA751> &7>"

formattedTime:
  weeks: [ "w.", "w.", "w." ]
  days: [ "d.", "d.", "d." ]
  hours: [ "h.", "h.", "h." ]
  minutes: [ "min.", "min.", "min." ]
  seconds: [ "sec.", "sec.", "sec." ]


restart-needed: "It seems the server administration loaded the plugin in an unusual way. If you are an administrator, you need to restart the server because this feature requires packet handling (packetevents)."

commands:
  transfer:
    - "[message] &#FC835C• /{cmd} {arg} [player] &7- &fTransfer clan to other player"
  rename:
    - "[message] &#FC835C• /{cmd} {arg} [tag] &7- &fRename clan tag"
  setprefix:
    - "[message] &#FC835C• /{cmd} {arg} [prefix] &7- &fSet the clan prefix"
  setslogan:
    - "[message] &#FC835C• /{cmd} {arg} [slogan] &7- &fSet the clan slogan"
  setrank:
    - "[message] &#FC835C• /{cmd} {arg} [rank] [name] &7- &fSet a rank for a player"
  kick:
    - "[message] &#FC835C• /{cmd} {arg} [name] &7- &fKick a player from your clan"
  invite:
    - "[message] &#FC835C• /{cmd} {arg} [name] &7- &fInvite a player to your clan"
  withdraw:
    - "[message] &#FC835C• /{cmd} {arg} [amount] &7- &fWithdraw from clan balance"
  deposit:
    - "[message] &#FC835C• /{cmd} {arg} [amount] &7- &fDeposit to clan balance"
  create:
    - "[message] &#FC835C• /{cmd} {arg} [tag] &7- &fCreate a clan"
  accept:
    - "[message] &#FC835C• /{cmd} {arg} [tag] &7- &fAccept a clan invitation"
  deny:
    - "[message] &#FC835C• /{cmd} {arg} [tag] &7- &fDecline a clan invitation"
