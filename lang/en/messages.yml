you-cant-leave-leader:
  - "[message] {prefix} &cYou can't leave this clan because you are the leader. If you want to disband this clan you can use /{cmd} disband"
player-not-found:
  - "[message] {prefix} &cPlayer not found"
player-not-in-clan:
  - "[message] {prefix} &cThat player is not in your clan"
clan-does-not-exist:
  - "[message] {prefix} &cClan {clan} not found."
clan-is-already-exists:
  - "[message] {prefix} &cThis clan already exists. Please choose a different tag"
clan-created-successfully:
  - "[message] {prefix} &aYou have successfully created the clan &e{clan_tag} &a!"
your-not-in-clan:
  - "[message] {prefix} &cYou are not in a clan!"
your-already-in-clan:
  - "[message] {prefix} &cYou are already in a clan"
clan-tag-too-short:
  - "[message] {prefix} &cTag is too short. Minimum length is {min_length} characters."
clan-tag-too-long:
  - "[message] {prefix} &cTag is too long! Maximum length is {max_length} characters."
disallowed-tag-regex:
  - "[message] {prefix} &cClan tag contains invalid characters"
clan-prefix-too-short:
  - "[message] {prefix} &cPrefix is too short. Minimum length is {min_length} characters."
clan-prefix-too-long:
  - "[message] {prefix} &cPrefix is too long! Maximum length is {max_length} characters."
disallowed-prefix-regex:
  - "[message] {prefix} &cClan prefix contains invalid characters"
clan-slogan-too-short:
  - "[message] {prefix} &cSlogan is too short. Minimum length is {min_length} characters."
clan-slogan-too-long:
  - "[message] {prefix} &cSlogan is too long! Maximum length is {max_length} characters."
disallowed-slogan-regex:
  - "[message] {prefix} &cSlogan contains invalid characters"
clan-tag-blocked:
  - "[message] {prefix} &cThis clan tag is not allowed!"
clan-you-cant-kick-yourself:
  - '[message] {prefix} &cYou cannot kick yourself'
clan-you-cant-setrank-yourself:
  - '[message] {prefix} &cYou cannot set a rank for yourself'
you-haven-not-enough-money:
  - "[message] {prefix} &cYou do not have enough funds!"
no-invite:
  - "[message] {prefix} &cThis clan has not sent you an invitation"
pvp-disabled:
  # If you don't need this message just leave it empty: pvp-disabled: {}
  - "[actionbar] &cPvP against clan members is disabled"
clan-deny:
  - "[message] {prefix} &cYou declined the clan invitation."

you-cant-do-that-with-leader:
  - "[message] {prefix} &cYou cannot perform this action against the clan leader"

your-rank-is-not-allowed-to-do-that:
  - "[message] {prefix} &cYou are not allowed to do that! Please ask your clan leader to grant you permission."


clan-create:
  - "[message] {prefix} &#17FF35You have successfully created the clan &l{clan}"
clan-balance:
  - "[message] {prefix} &fClan balance: &#17FF35&l${balance}"
clan-balance-deposit:
  - "[message] {prefix} &#17FF35You successfully &edeposited &#17FF35to the clan balance: &l${sum}"
clan-balance-limit:
  - "[message] {prefix} &cClan balance limit reached! &7(Limit: {max-balance})"
clan-deposit-no-money:
  - '[message] {prefix} &cYou do not have enough funds to deposit that amount'
clan-balance-withdraw:
  - "[message] {prefix} &#17FF35You successfully &cwithdrawn &#17FF35from the clan balance: &l${sum}"
clan-player-kick:
  - "[message] {prefix} &aYou kicked player {target} from the clan"
clan-you-was-kicked:
  - "[message] {prefix} &aPlayer {player} kicked you from the clan"
clan-invite:
  - "[message] {prefix} &#17FF35Clan invitation successfully sent to &l{target}&r&#17FF35."
clan-already-invited:
  - "[message] {prefix} &cYou have already sent an invitation to this player."
clan-player-already-in-clan:
  - "[message] {prefix} &7This player is already in a clan"
clan-invite-denied:
  - "[message] {prefix} &cPlayer &f{target} &cdeclined your invitation."
clan-invite-limit:
  - "[message] {prefix} &cClan member limit reached"
clan-setrank:
  - "[message] {prefix} &fYou set the rank {rank_prefix} &ffor player &e{target}"
clan-join-request:
  - "[message] {prefix} &#17FF35You have received a join request for clan &l{clan} &r&#17FF35from player &f&l{player}"
  - "[message] &r"
  - "[message] {prefix} &#17FF35You have received a join request for clan &l{clan} &r&#17FF35from player &f&l{player}"
  - "[message] &r"
  - "[message] <hover:show_text:'&7Click to <#17FF35>accept'><click:run_command:/{cmd} accept {clan}>              <#17FF35>[Accept]</click></hover> &7| <hover:show_text:'&7Click to <#FB0000>decline&c'><click:run_command:/{cmd} deny {clan}><#FB0000>[Decline]</click></hover>"
  - "[message] &r"
clan-join:
  - '[message] {prefix} &aYou joined the clan {clan}'
  - '[team_msg] {prefix} &aA new player &f{player}&a has joined the clan. Welcome them!'
clan-chat-on:
  - '[message] {prefix} &fClan chat &#17FF35enabled'
clan-chat-off:
  - '[message] {prefix} &fClan chat &#FB0000disabled'
clan-pvp-on:
  - '[message] {prefix} &fClan pvp &#17FF35enabled'
clan-pvp-off:
  - '[message] {prefix} &fClan pvp &#FB0000disabled'
clan-disband:
  - '[message] {prefix} &a&lClan has been successfully disbanded'
  - '[team_msg] {prefix} &c&lYour clan has been disbanded by the leader'
clan-disband-confirm:
  - '[message] {prefix} &c&lConfirm that you want to permanently delete your clan by running the command again.'
clan-leave:
  - "[message] {prefix} &eYou left the clan {clan}"
  - "[team_msg] {prefix} &cPlayer {player} left the clan"
clan-setbase:
  - '[message] {prefix} &aLocation successfully set'
clan-base:
  - '[actionbar] &7Teleporting to base'
clan-base-unset:
  - '[message] &cClan base is not set'
clan-setslogan:
  - "[message] {prefix} &fYou set the clan slogan to: &6{slogan}"
clan-setprefix:
  - "[message] {prefix} &fYou set the clan prefix to: &6{clan_prefix}"
clan-renamed:
  - '[message] {prefix} &fYou changed the clan tag from {old} to {new}.'
clan-transfer:
  - '[team_msg] {prefix} &cClan has been handed over to {target}, meet your new leader.'


